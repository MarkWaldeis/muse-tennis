<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { SkeletonUtils } from 'three/addons/utils/SkeletonUtils.js';

// ============================================================
// COURT_DIMENSIONS - Single source of truth for later game logic
// TODO (future game):
//  - Ball bounce: use length/width/serviceDistance for collision
//  - Player spawn: baseline1 z=+11.885+1.5, baseline2 z=-11.885-1.5
//  - Net collision: netHeightCenter/Post + postX
// ============================================================
export const COURT_DIMENSIONS = {
  length: 23.77,          // z, doubles
  width: 10.97,           // x, doubles
  singlesWidth: 8.23,     // x
  serviceDistance: 6.4,   // from net (z=0) to service line
  netHeightCenter: 0.914,
  netHeightPost: 1.07,
  postOffset: 0.914,      // outside doubles sideline
  lineWidth: 0.05,
  baselineWidth: 0.10,
  halfLength: 23.77 / 2,  // 11.885
  halfWidth: 10.97 / 2,   // 5.485
  halfSingles: 8.23 / 2,  // 4.115
  // TODO: picks for game
  playerSpawnZ: 11.885 + 2.0,
  colors: {
    innerBlue: 0x2a5dca,
    outerGreen: 0x3a9e4f,
    groundDark: 0x2e7d43,
    lineWhite: 0xffffff,
    netBlack: 0x111111,
    postGreen: 0x1e4d2b
  }
};

// ---------- Renderer / Scene / Camera ----------
const PROBE = new URLSearchParams(location.search).has('probe');
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: !PROBE, powerPreference: PROBE ? 'low-power' : 'default' });
renderer.setSize(PROBE ? 640 : window.innerWidth, PROBE ? 360 : window.innerHeight);
renderer.setPixelRatio(PROBE ? 0.5 : Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = !PROBE;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b5d6);
scene.fog = new THREE.Fog(0x87b5d6, 60, 160);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(15, 12, 15);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.minDistance = 5;
controls.maxDistance = 80;
controls.update();

// ---------- Lights ----------
function createLights(s) {
  const hemi = new THREE.HemisphereLight(0xffffff, 0x334433, 0.9);
  s.add(hemi);

  const sun = new THREE.DirectionalLight(0xffffff, 1.7);
  sun.position.set(20, 30, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -25;
  sun.shadow.camera.right = 25;
  sun.shadow.camera.top = 25;
  sun.shadow.camera.bottom = -25;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 80;
  sun.shadow.bias = -0.0005;
  s.add(sun);
}
createLights(scene);

// ---------- Helpers ----------
function makeNetTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.strokeStyle = 'rgba(15,15,15,1)';
  ctx.lineWidth = 2;
  const step = 8;
  for (let x = 0; x <= c.width; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, c.height); ctx.stroke();
  }
  for (let y = 0; y <= c.height; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(c.width, y); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(60, 4);
  tex.anisotropy = 4;
  return tex;
}

function netTopY(x) {
  const D = COURT_DIMENSIONS;
  const half = D.halfWidth + D.postOffset; // 6.399
  const t = THREE.MathUtils.clamp(x / half, -1, 1);
  return D.netHeightCenter + (D.netHeightPost - D.netHeightCenter) * t * t;
}

// ============================================================
// createTennisCourt(scene): returns courtGroup
// Group structure for future game:
//  courtGroup
//   ├─ groundOuter (name: groundOuter)
//   ├─ courtSurface (name: courtSurface) <- TODO: ball bounce raycast target
//   ├─ linesGroup (all white lines)
//   └─ netGroup (name: netGroup) <- TODO: net collision
// ============================================================
export function createTennisCourt(s) {
  const D = COURT_DIMENSIONS;
  const courtGroup = new THREE.Group();
  courtGroup.name = 'courtGroup';

  // 1. Outer green area: 30 (x) x 40 (z) -> run-off included
  const groundGeo = new THREE.PlaneGeometry(30, 40);
  const groundMat = new THREE.MeshStandardMaterial({
    color: D.colors.outerGreen, roughness: 0.95, metalness: 0.0
  });
  const groundOuter = new THREE.Mesh(groundGeo, groundMat);
  groundOuter.rotation.x = -Math.PI / 2;
  groundOuter.position.y = 0;
  groundOuter.receiveShadow = true;
  groundOuter.name = 'groundOuter';
  courtGroup.add(groundOuter);

  // 2. Inner blue court: exactly doubles size
  const blueGeo = new THREE.PlaneGeometry(D.width, D.length);
  const blueMat = new THREE.MeshStandardMaterial({
    color: D.colors.innerBlue, roughness: 0.9, metalness: 0.0,
    polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
  });
  const courtSurface = new THREE.Mesh(blueGeo, blueMat);
  courtSurface.rotation.x = -Math.PI / 2;
  courtSurface.position.y = 0.005;
  courtSurface.receiveShadow = true;
  courtSurface.name = 'courtSurface';
  courtGroup.add(courtSurface);

  // 3. White lines, 0.01m above ground
  const linesGroup = new THREE.Group();
  linesGroup.name = 'linesGroup';
  const lineMat = new THREE.MeshStandardMaterial({
    color: D.colors.lineWhite, roughness: 0.8,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
  });

  function addLine(w, l, x, z, name) {
    const g = new THREE.PlaneGeometry(w, l);
    const m = new THREE.Mesh(g, lineMat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, 0.015, z);
    m.receiveShadow = true;
    m.name = name;
    linesGroup.add(m);
    return m;
  }

  const LW = D.lineWidth;       // 0.05
  const BW = D.baselineWidth;   // 0.10
  const HL = D.halfLength;      // 11.885
  const HW = D.halfWidth;       // 5.485
  const HS = D.halfSingles;     // 4.115

  // Baselines (full width, outer edge = court limit)
  addLine(D.width, BW, 0,  (HL - BW / 2), 'baselineTop');
  addLine(D.width, BW, 0, -(HL - BW / 2), 'baselineBottom');

  // Doubles sidelines (between baselines to avoid overlap z-fight)
  const sideLen = D.length - BW * 2;
  addLine(LW, sideLen,  (HW - LW / 2), 0, 'doublesSidelineR');
  addLine(LW, sideLen, -(HW - LW / 2), 0, 'doublesSidelineL');

  // Singles sidelines
  addLine(LW, sideLen,  (HS - LW / 2), 0, 'singlesSidelineR');
  addLine(LW, sideLen, -(HS - LW / 2), 0, 'singlesSidelineL');

  // Service lines (parallel to net, span singles width)
  addLine(D.singlesWidth, LW, 0,  D.serviceDistance, 'serviceLineTop');
  addLine(D.singlesWidth, LW, 0, -D.serviceDistance, 'serviceLineBottom');

  // Center service line (between service lines)
  addLine(LW, D.serviceDistance * 2 - LW, 0, 0, 'centerServiceLine');

  // Center marks (10cm inside, at baselines)
  addLine(LW, 0.10, 0,  (HL - BW - 0.05), 'centerMarkTop');
  addLine(LW, 0.10, 0, -(HL - BW - 0.05), 'centerMarkBottom');

  courtGroup.add(linesGroup);

  // 4. Net
  const netGroup = new THREE.Group();
  netGroup.name = 'netGroup';

  const postX = HW + D.postOffset; // 6.399
  const netW = postX * 2;          // 12.798

  // Net fabric with sag curve
  const netGeo = new THREE.PlaneGeometry(netW, 1.07, 48, 1);
  const pos = netGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    if (y > 0) pos.setY(i, netTopY(x)); // top follows sag
    else pos.setY(i, 0.06);             // bottom slightly above ground
  }
  netGeo.computeVertexNormals();
  const netMat = new THREE.MeshStandardMaterial({
    map: makeNetTexture(),
    transparent: true,
    side: THREE.DoubleSide,
    roughness: 0.9,
    metalness: 0.0,
    alphaTest: 0.15
  });
  const netMesh = new THREE.Mesh(netGeo, netMat);
  netMesh.castShadow = true;
  netMesh.name = 'netMesh';
  // TODO (game): netMesh -> ball collision plane at z=0
  netGroup.add(netMesh);

  // White top tape following sag (segmented boxes)
  const tapeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
  const segs = 48;
  for (let i = 0; i < segs; i++) {
    const x0 = -postX + (netW * i) / segs;
    const x1 = -postX + (netW * (i + 1)) / segs;
    const xm = (x0 + x1) / 2;
    const y = netTopY(xm);
    const slope = (netTopY(x1) - netTopY(x0)) / (x1 - x0);
    const len = Math.sqrt((x1 - x0) ** 2 + (netTopY(x1) - netTopY(x0)) ** 2);
    const box = new THREE.Mesh(new THREE.BoxGeometry(len + 0.005, 0.06, 0.05), tapeMat);
    box.position.set(xm, y - 0.03, 0);
    box.rotation.z = Math.atan(slope);
    box.castShadow = true;
    box.name = 'netTape';
    netGroup.add(box);
  }

  // Posts
  const postGeo = new THREE.CylinderGeometry(0.075, 0.075, D.netHeightPost, 20);
  const postMat = new THREE.MeshStandardMaterial({ color: D.colors.postGreen, roughness: 0.5, metalness: 0.4 });
  [-postX, postX].forEach((x, idx) => {
    const p = new THREE.Mesh(postGeo, postMat);
    p.position.set(x, D.netHeightPost / 2, 0);
    p.castShadow = true;
    p.name = idx === 0 ? 'netPostL' : 'netPostR';
    netGroup.add(p);
    // cap
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12), postMat);
    cap.position.set(x, D.netHeightPost, 0);
    netGroup.add(cap);
  });

  // Center strap
  const strap = new THREE.Mesh(
    new THREE.BoxGeometry(0.05, D.netHeightCenter, 0.02),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 })
  );
  strap.position.set(0, D.netHeightCenter / 2, 0);
  strap.name = 'centerStrap';
  netGroup.add(strap);

  courtGroup.add(netGroup);

  // 5. Simple fence around 30x40 (dark, semi-transparent)
  const fenceGroup = new THREE.Group();
  fenceGroup.name = 'fenceGroup';
  const fenceH = 3.2;
  const fenceMat = new THREE.MeshStandardMaterial({
    color: 0x1c2b22, transparent: true, opacity: 0.35,
    side: THREE.DoubleSide, roughness: 0.9
  });
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x2b3a30, roughness: 0.6, metalness: 0.3 });

  function addFenceRun(w, x, z, rotY) {
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(w, fenceH), fenceMat);
    panel.position.set(x, fenceH / 2, z);
    panel.rotation.y = rotY;
    fenceGroup.add(panel);
  }
  // 4 sides at x=±15, z=±20
  addFenceRun(30, 0, -20, 0);
  addFenceRun(30, 0,  20, 0);
  addFenceRun(40, -15, 0, Math.PI / 2);
  addFenceRun(40,  15, 0, Math.PI / 2);

  // posts every 5m
  const poleGeo = new THREE.CylinderGeometry(0.06, 0.06, fenceH, 10);
  for (let x = -15; x <= 15; x += 5) {
    [-20, 20].forEach(z => {
      const pole = new THREE.Mesh(poleGeo, poleMat);
      pole.position.set(x, fenceH / 2, z);
      pole.castShadow = true;
      fenceGroup.add(pole);
    });
  }
  for (let z = -20; z <= 20; z += 5) {
    [-15, 15].forEach(x => {
      const pole = new THREE.Mesh(poleGeo, poleMat);
      pole.position.set(x, fenceH / 2, z);
      pole.castShadow = true;
      fenceGroup.add(pole);
    });
  }
  courtGroup.add(fenceGroup);

  s.add(courtGroup);
  return courtGroup;
}

// ============================================================
// PLAYER - rigged Tripo bird mascot (Mixamo skeleton, volumetric weights)
// API for later game:
//   const player = createPlayer(scene)
//   player.group.position -> spawn / reset
//   player.update(dt, input) -> movement + animation
//   player.swing() -> TODO: trigger on ball hit (Space already calls it)
//   TODO: serve, hit reaction, stamina, multiplayer/opponent uses same factory
// ============================================================
export const PLAYER = {
  maxSpeed: 7.0,
  accelLerp: 10.0,
  spawn: new THREE.Vector3(0, 0, 13.8),
  bounds: { minX: -9, maxX: 9, minZ: 0.5, maxZ: 17 },
  colors: {
    skin: 0xffcc9e, shirt: 0xff5a5a, shorts: 0x3344ff,
    shoes: 0xffffff, cap: 0x2a5dca, racket: 0xffd23f
  }
};

// Rigged Tripo mascot: 1m bind pose, Mixamo joints, volumetric weights.
const MASCOT_SCALE = 1.65;
const MASCOT_URL = 'assets/mascot-bird-rigged.glb';
let mascotGltf = null;

function collectBones(root) {
  const map = new Map();
  root.traverse((o) => { if (o.isBone) map.set(o.name, o); });
  return map;
}
function boneByName(bones, name) {
  return bones.get(name) || bones.get(name.replace('mixamorig:', '')) || null;
}

// T-pose wings sit along ±X. Tennis poses use:
//   down: 1 = hang, 0 = T-pose, -1 = straight up
//   fwd:  + toward the net (-Z), − take-back
// Racket is parented so it stays outboard of the hand (never through the belly).
function armDownZ(side, down) {
  return -side * Math.PI * 0.5 * down;
}
function easeInOutCubic(k) { k = THREE.MathUtils.clamp(k, 0, 1); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }
function easeOutCubic(k) { k = THREE.MathUtils.clamp(k, 0, 1); return 1 - Math.pow(1 - k, 3); }
function easeInCubic(k) { k = THREE.MathUtils.clamp(k, 0, 1); return k * k * k; }
const lerp = THREE.MathUtils.lerp;

function poseTail(bones, t, intensity) {
  const a = Math.sin(t * 4.2) * 0.18 * (0.25 + intensity);
  const b = Math.sin(t * 5.1 + 0.6) * 0.12 * (0.25 + intensity);
  const tail = boneByName(bones, 'mixamorig:Tail');
  const tail1 = boneByName(bones, 'mixamorig:Tail1');
  const tail2 = boneByName(bones, 'mixamorig:Tail2');
  const crest = boneByName(bones, 'mixamorig:Head_Crest1');
  if (tail) tail.rotation.y = a;
  if (tail1) tail1.rotation.y = a * 0.7;
  if (tail2) tail2.rotation.x = b;
  if (crest) crest.rotation.z = Math.sin(t * 3.2) * 0.08;
}

function curlFingers(bones, tag, amount) {
  const side = tag === 'Left' ? -1 : 1;
  for (const f of ['Thumb', 'Index', 'Middle', 'Ring', 'Pinky']) {
    const thumb = f === 'Thumb' ? 0.55 : 1;
    for (let n = 1; n <= 3; n++) {
      const b = boneByName(bones, `mixamorig:${tag}Hand${f}${n}`);
      if (b) b.rotation.y = side * amount * thumb * (0.55 + n * 0.28);
    }
  }
}

// Groundstroke keyframe durations (s); forehand/backhand total ~0.47s
// Phases: PREP (unit turn) -> LOOP (take-back) -> SWING (explosive) -> FOLLOW (recover)
export const STROKE_TIMING = { prep: 0.12, loop: 0.10, swing: 0.10, follow: 0.15 };

// Keyboard input (WASD + arrows + Space + C)
export const input = { x: 0, z: 0, swingPressed: false };
const keys = {};
window.addEventListener('keydown', (e) => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' && !e.repeat) input.swingPressed = true;
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

function pollInput() {
  const left = keys['a'] || keys['arrowleft'] ? 1 : 0;
  const right = keys['d'] || keys['arrowright'] ? 1 : 0;
  const up = keys['w'] || keys['arrowup'] ? 1 : 0;       // to net (-z)
  const down = keys['s'] || keys['arrowdown'] ? 1 : 0;   // away (+z)
  input.x = right - left;
  input.z = down - up; // -1 = forward to net, +1 = back
  const len = Math.hypot(input.x, input.z);
  if (len > 1) { input.x /= len; input.z /= len; }
}

function makeStringTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 64, 64);
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = 2;
  for (let i = 8; i < 64; i += 12) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 64); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(64, i); ctx.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  return t;
}

export function createPlayer(s, opts = {}) {
  const C = PLAYER.colors;
  const faceDir = opts.faceDir || -1; // -1: bottom half, faces net (-z) | +1: top half, faces +z
  const baseYaw = faceDir > 0 ? Math.PI : 0;
  const maxSp = opts.speed || PLAYER.maxSpeed;
  const B = opts.bounds || PLAYER.bounds;
  const group = new THREE.Group();
  group.name = opts.name || 'player';
  group.position.copy(opts.spawn || PLAYER.spawn);
  group.rotation.y = baseYaw; // face/eyes are local -z, baseYaw turns AI to +z

  const root = new THREE.Group(); // bob + lean goes here
  root.name = 'playerRoot';
  group.add(root);

  function shadowed(m) { m.castShadow = true; return m; }

  const model = SkeletonUtils.clone(mascotGltf.scene);
  model.name = 'mascot';
  model.scale.setScalar(MASCOT_SCALE);
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;
    o.frustumCulled = false;
    if (opts.shirtColor != null) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      const tinted = mats.map((m) => {
        const c = m.clone();
        c.color = c.color.clone().lerp(new THREE.Color(opts.shirtColor), 0.4);
        return c;
      });
      o.material = Array.isArray(o.material) ? tinted : tinted[0];
    }
  });
  root.add(model);

  const bones = collectBones(model);
  const leftArm = boneByName(bones, 'mixamorig:LeftArm');
  const rightArm = boneByName(bones, 'mixamorig:RightArm');
  const leftFore = boneByName(bones, 'mixamorig:LeftForeArm');
  const rightFore = boneByName(bones, 'mixamorig:RightForeArm');
  const leftHand = boneByName(bones, 'mixamorig:LeftHand');
  const rightHand = boneByName(bones, 'mixamorig:RightHand');
  const leftShoulder = boneByName(bones, 'mixamorig:LeftShoulder');
  const rightShoulder = boneByName(bones, 'mixamorig:RightShoulder');
  const legL = boneByName(bones, 'mixamorig:LeftUpLeg');
  const legR = boneByName(bones, 'mixamorig:RightUpLeg');
  const kneeL = boneByName(bones, 'mixamorig:LeftLeg');
  const kneeR = boneByName(bones, 'mixamorig:RightLeg');
  const spine = boneByName(bones, 'mixamorig:Spine');
  const spine1 = boneByName(bones, 'mixamorig:Spine1');
  const hipsBone = boneByName(bones, 'mixamorig:Hips');
  const neckBone = boneByName(bones, 'mixamorig:Neck');
  const torso = spine1 || root;
  const headGroup = boneByName(bones, 'mixamorig:Head') || root;

  const fistL = {
    getWorldPosition(out) {
      group.updateMatrixWorld(true);
      if (leftHand) return leftHand.getWorldPosition(out);

    racket.rotation.set(P.racket.x, P.racket.y, P.racket.z);
    curlFingers(bones, 'Right', P.fingersR);
    curlFingers(bones, 'Left', P.fingersL);
    poseTail(bones, e.time ?? 0, e.intensity ?? 0);
    keepRacketClear();
  }

  function captureRig() {
    const list = [];
    model.traverse((o) => {
      if (o.isBone) list.push({ b: o, q: o.quaternion.clone() });
    });
    return {
      bones: list,
      rootP: root.position.clone(),
      rootR: root.rotation.clone(),
      racketR: racket.rotation.clone()
    };
  }
  function blendRig(from, e) {
    if (!from) return;
    for (const s of from.bones) {
      const target = s.b.quaternion.clone();
      s.b.quaternion.copy(s.q).slerp(target, e);
    }
    root.position.lerpVectors(from.rootP, root.position, e);
    root.rotation.x = lerp(from.rootR.x, root.rotation.x, e);
    root.rotation.y = lerp(from.rootR.y, root.rotation.y, e);
    root.rotation.z = lerp(from.rootR.z, root.rotation.z, e);
    racket.rotation.x = lerp(from.racketR.x, racket.rotation.x, e);
    racket.rotation.y = lerp(from.racketR.y, racket.rotation.y, e);
    racket.rotation.z = lerp(from.racketR.z, racket.rotation.z, e);
    keepRacketClear();
  }

  // Public adapters so the serve controller can still read a left-hand world pos
  // and so existing joints.racket writes don't crash. Rotations are driven by clips.
  const armL = { rotation: leftArm ? leftArm.rotation : new THREE.Euler(), position: leftArm ? leftArm.position : new THREE.Vector3(), bone: leftArm };
  const armR = { rotation: rightArm ? rightArm.rotation : new THREE.Euler(), position: rightArm ? rightArm.position : new THREE.Vector3(), bone: rightArm };

  // --- state ---
  const vel = new THREE.Vector3();
  const target = new THREE.Vector3();
  let walkCycle = 0;
  let time = 0;
  // Groundstroke state machine (replaces the old single-whip swingTimer).
  // Backward compatible: swing() auto-selects forehand/backhand from noted ball side.
  let stroke = null; // { type: 'forehand'|'backhand', t, dur }
  let strokeK = 1;
  let notedDX = 0; // ball.x - player.x in world, refreshed per frame via noteBall()
  let splitT = 0;  // split-step hop timer (set by splitStep())

  function playStroke(type) {
    const t = (type === 'backhand') ? 'backhand' : 'forehand';
    if (!stroke) {
      stroke = { type: t, t: 0, dur: STROKE_TIMING.prep + STROKE_TIMING.loop + STROKE_TIMING.swing + STROKE_TIMING.follow };
    }
    // TODO (sound): prefetch stroke whoosh here
  }
  function noteBall(dx) { notedDX = dx; }
  function splitStep() { splitT = 0.25; }
  function swing() {
    if (stroke) return;
    playStroke(notedDX * faceDir > 0.3 ? 'backhand' : 'forehand');
  }

  function update(dt, ext) {
    time += dt;
    const mv = ext || input;
    target.set(mv.x * maxSp, 0, mv.z * maxSp);
    vel.lerp(target, Math.min(1, dt * PLAYER.accelLerp));
    group.position.x += vel.x * dt;
    group.position.z += vel.z * dt;
    group.position.x = THREE.MathUtils.clamp(group.position.x, B.minX, B.maxX);
    group.position.z = THREE.MathUtils.clamp(group.position.z, B.minZ, B.maxZ);

    const speed = Math.hypot(vel.x, vel.z);
    const intensity = THREE.MathUtils.clamp(speed / PLAYER.maxSpeed, 0, 1);
    walkCycle += dt * (3 + speed * 1.9);
    const bob0 = Math.abs(Math.sin(walkCycle * 2.4)) * 0.07 * intensity + Math.sin(time * 2.5) * 0.014;
    if (splitT > 0) splitT = Math.max(0, splitT - dt);
    const splitHop0 = splitT > 0 ? Math.sin((0.25 - splitT) / 0.25 * Math.PI) * 0.08 : 0;
    const breathe = 1 + Math.sin(time * 3) * 0.02 * (1 - intensity * 0.5);

    group.rotation.y = baseYaw + THREE.MathUtils.clamp(vel.x * 0.045, -0.35, 0.35);

    if (ext && ext.skipPose) return false;

    if (stroke) {
      stroke.t += dt;
      strokeK = Math.min(1, stroke.t / stroke.dur);
      applyTennisPose(stroke.type, strokeK, {
        bob: bob0, hop: splitHop0, time, intensity, breathe, vx: vel.x, walk: walkCycle
      });
      if (strokeK >= 1) stroke = null;
    } else {
      applyTennisPose(intensity > 0.08 ? 'run' : 'idle', 0, {
        bob: bob0, hop: splitHop0, time, intensity, breathe, vx: vel.x,
        walk: walkCycle, split: splitT > 0
      });
    }

    let startedSwing = false;
    if (!ext && input.swingPressed) { input.swingPressed = false; swing(); startedSwing = true; }
    return startedSwing;
  }

  return {
    group, root, update, swing, playStroke, noteBall, splitStep, velocity: vel,
    applyTennisPose, captureRig, blendRig, keepRacketClear, sampleRacketClearance,
    joints: { root, torso, head: headGroup, armL, armR, legL, legR, racket, fistL, fistR }
  };
}

// ============================================================
// BALL - arcade physics, no external assets
// API for later game:
//   ball.hit(from, to, flightTime) -> ballistic shot landing at `to`
//   ball.reset(pos) -> drop ball at pos
//   ball.update(dt) returns null | { x, z, side, out } on bounce
//   TODO: spin/topspin, out-calls vs singles lines, sound, serve toss
// ============================================================
export const BALL = {
  radius: 0.13, // real 0.033, scaled x4 for visibility
  gravity: -18.0,
  bounceDamping: 0.72,
  friction: 0.985
};

function makeBallTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#cde336';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, 64);
  ctx.bezierCurveTo(35, 40, 35, 24, 0, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(128, 64);
  ctx.bezierCurveTo(93, 40, 93, 24, 128, 0); ctx.stroke();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

export function createBall(s) {
  const group = new THREE.Group();
  group.name = 'ball';
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(BALL.radius, 20, 14),
    new THREE.MeshStandardMaterial({ map: makeBallTexture(), roughness: 0.6 })
  );
  mesh.castShadow = true;
  group.add(mesh);
  s.add(group);

  // Trail: 14 fading mini-spheres (cheap, no post-processing)
  const TRAIL_N = 14;
  const trail = [];
  const history = [];
  for (let i = 0; i < TRAIL_N; i++) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(BALL.radius * 0.55, 8, 6),
      new THREE.MeshBasicMaterial({ color: 0xeaff70, transparent: true, opacity: 0.35 * (1 - i / TRAIL_N) })
    );
    m.visible = false;
    s.add(m);
    trail.push(m);
    history.push(new THREE.Vector3());
  }
  let historyInit = false;

  const velocity = new THREE.Vector3();
  let bouncesSinceHit = 0;
  let lastHitter = null; // 'player' | 'ai'
  let touchedNet = false; // set on net contact, cleared on hit()/reset() - used for let calls
  let spinAxis = new THREE.Vector3(1, 0, 0);

  function reset(pos) {
    group.position.copy(pos);
    velocity.set(0, 0, 0);
    bouncesSinceHit = 0;
    lastHitter = null;
    touchedNet = false;
    historyInit = false;
    trail.forEach(m => { m.visible = false; });
  }

  // Ballistic shot: choose velocity so ball lands at `to` after flightTime
  function hit(from, to, flightTime = 0.95) {
    const t = Math.max(0.3, flightTime);
    group.position.copy(from);
    velocity.set(
      (to.x - from.x) / t,
      (to.y - from.y - 0.5 * BALL.gravity * t * t) / t,
      (to.z - from.z) / t
    );
    bouncesSinceHit = 0;
    touchedNet = false;
    spinAxis.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
  }

  function update(dt) {
    const prevZ = group.position.z;
    velocity.y += BALL.gravity * dt;
    group.position.addScaledVector(velocity, dt);

    // Net collision: crossing z=0 below tape height
    if ((prevZ > 0) !== (group.position.z > 0)) {
      const top = netTopY(group.position.x) + BALL.radius * 0.5;
      if (group.position.z !== prevZ && group.position.y < top) {
        group.position.z = prevZ > 0 ? BALL.radius : -BALL.radius;
        velocity.z *= -0.15;
        velocity.x *= 0.3;
        velocity.y = Math.min(velocity.y, -1);
        touchedNet = true; // serve controller reads this for let calls
      }
    }

    // Ground bounce (court at y~0.005-0.015, treat as 0)
    let bounceEvent = null;
    if (group.position.y <= BALL.radius && velocity.y < 0) {
      group.position.y = BALL.radius;
      if (Math.abs(velocity.y) < 1.4) velocity.y = 0; // roll-out, no endless micro-bounce
      else velocity.y *= -BALL.bounceDamping;
      velocity.x *= BALL.friction;
      velocity.z *= BALL.friction;
      bouncesSinceHit++;
      const side = group.position.z > 0 ? 'player' : 'ai';
      const out = Math.abs(group.position.x) > 5.9 || Math.abs(group.position.z) > 12.4;
      bounceEvent = { x: group.position.x, z: group.position.z, side, out, n: bouncesSinceHit };
      // TODO (game): strict out-call vs singles/doubles lines + let-calls
    }

    // Cute spin + trail
    const sp = velocity.length();
    if (sp > 0.01) {
      mesh.rotateOnWorldAxis(spinAxis, sp * dt * 1.2);
      if (!historyInit) {
        for (const h of history) h.copy(group.position);
        historyInit = true;
      }
      for (let i = TRAIL_N - 1; i > 0; i--) history[i].copy(history[i - 1]);
      history[0].copy(group.position);
      const showTrail = sp > 4;
      for (let i = 0; i < TRAIL_N; i++) {
        trail[i].visible = showTrail;
        if (showTrail) trail[i].position.copy(history[i]);
      }
    } else {
      trail.forEach(m => { m.visible = false; });
    }
    return bounceEvent;
  }

  return {
    mesh: group, velocity, update, hit, reset,
    get bounces() { return bouncesSinceHit; },
    get hitter() { return lastHitter; },
    set hitter(v) { lastHitter = v; },
    get netTouched() { return touchedNet; },
    set netTouched(v) { touchedNet = v; }
  };
}

// ============================================================
// OPPONENT AI - drives a second chibi via virtual input
// States: READY(home) -> TRACK(predicted landing) -> HIT -> RECOVER
// TODO (game): difficulty levels, error chance by pressure, serve return,
//   lob/smash recognition, stamina
// ============================================================
export const AI = {
  speed: 6.0,
  reach: 2.4,
  error: 0.45,
  home: new THREE.Vector3(0, 0, -11.5),
  hitCooldown: 0.6
};

export function createOpponentAI(opp, ball) {
  const aiInput = { x: 0, z: 0 };
  let cooldown = 0;

  // Simulate gravity-only flight to predict landing spot
  function predictLanding() {
    const p = ball.mesh.position.clone();
    const v = ball.velocity.clone();
    const dt = 1 / 60;
    for (let t = 0; t < 3; t += dt) {
      v.y += BALL.gravity * dt;
      p.addScaledVector(v, dt);
      if (p.y <= BALL.radius) break;
    }
    return p;
  }

  function pickTarget() {
    // Corners on player side, small error can cause outs (fun + TODO scoring)
    const cornerX = (Math.random() < 0.5 ? -1 : 1) * (2.2 + Math.random() * 2.4);
    return new THREE.Vector3(
      THREE.MathUtils.clamp(cornerX + (Math.random() - 0.5) * 2 * AI.error, -6.5, 6.5),
      BALL.radius,
      6.2 + Math.random() * 5.0 + (Math.random() - 0.5) * AI.error
    );
  }

  function update(dt) {
    cooldown = Math.max(0, cooldown - dt);
    const bp = ball.mesh.position;
    const op = opp.group.position;

    // Where to run? Chase predicted landing if ball is ours, else go home.
    let tx = AI.home.x, tz = AI.home.z;
    const incoming = ball.velocity.z < -0.5 && bp.z > -2;
    if (bp.z < 1.0 || incoming) {
      const land = predictLanding();
      if (land.z < 1.0) { tx = land.x; tz = land.z - 0.7; }
    }
    tx = THREE.MathUtils.clamp(tx, -9, 9);
    tz = THREE.MathUtils.clamp(tz, -17, -0.5);
    aiInput.x = THREE.MathUtils.clamp((tx - op.x) * 0.9, -1, 1);
    aiInput.z = THREE.MathUtils.clamp((tz - op.z) * 0.9, -1, 1);
    const l = Math.hypot(aiInput.x, aiInput.z);
    if (l > 1) { aiInput.x /= l; aiInput.z /= l; }
    opp.update(dt, aiInput);

    // Hit when close, low enough, on our side
    const dist = Math.hypot(bp.x - op.x, bp.z - op.z);
    if (cooldown <= 0 && bp.z < 0.4 && bp.y < 2.4 && dist < AI.reach) {
      opp.noteBall(bp.x - op.x); // refresh side AFTER the run-up: correct forehand/backhand pick
      opp.swing();
      ball.hitter = 'ai';
      ball.hit(bp.clone(), pickTarget(), 0.9 + Math.random() * 0.25);
      cooldown = AI.hitCooldown;
      return true;
    }
    return false;
  }

  return { update, input: aiInput };
}

// ============================================================
// SERVE - state machine + keyframed procedural animation
// Flow: READY -> TOSS -> STRIKE -> FOLLOW -> RALLY(off, watch armed)
// Faults: FAULT -> READY (2nd serve) -> DOUBLE FAULT (point, side toggles)
// Geometry note: serve is diagonal, x flips sign across the net:
//   deuce (server x>0) -> box x<0 on AI side, ad mirrored. (ITF verified)
// TODO (game): real score 15/30/40, AI serves, sound hooks
// ============================================================
export const SERVE_TIMING = {
  windup: 0.15,  // arm lift with ball in hand before release (total serve ~1.5s)
  strike: 0.16,  // explosive whip (first 0.08s = frozen impact frame)
  follow: 0.70,  // follow-through + recover
  freeze: 0.08,  // 80ms impact frame (ball held at contact)
  slowmo2nd: 0.85 // 2nd serve animation speed factor
};
// Hard court-lock wall: whole backfield (x +-9, z 12.12..17) is free during serve
// READY, but the court itself is physically unreachable. Baseline = 11.885,
// shoe toe reaches 0.19m ahead of the group origin, so 12.12 keeps even the toe legal.
const SERVE_WALL_Z = 12.12;
const SERVE_SIDE_MIN = 0.3; // diagonal serve: deuce serves from x>=+0.3, ad from x<=-0.3.
// Crossing the center line sideways is physically impossible during the serve.
export const SERVE = {
  server: 'player', faults: 0, side: 'deuce', points: 0, firstServe: true
};
const SERVE_TOSS_V0 = 7.0;   // toss up-speed -> apex ~2.0m from ~0.65m hand (chibi reach!)
// Contact = ball position at strike moment (exact sync by construction, zero snap).
// Racket head reaches ~1.9m overhead, so apex ~2.0m keeps the gap <= 0.15m.
const SERVE_BOX = { xMax: 4.115, zServe: 6.4 }; // singles box limits

function makeFlashTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,255,240,0.85)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

export function createServeController(pl, bl, s) {
  const J = pl.joints;
  const tmpV = new THREE.Vector3();
  const contact = new THREE.Vector3();
  const tossPos = new THREE.Vector3();
  let tossVel = 0;

  let mode = 'off'; // off | ready | toss | strike | follow
  let tPhase = 0;
  let released = false; // toss ball released from hand?
  let rockT = 0;      // pre-serve rocking rhythm timer (reset on enterReady)
  let wallShake = 0;  // wall-push feedback timer
  let blendFrom = null, blendT = 1, releaseT = 0; // pop-free blending (see below)
  let apexT = SERVE_TOSS_V0 / -BALL.gravity; // ~0.39s
  let apexY = 0;
  let handY = 0;
  let freezeT = 0;
  let flashT = 1; // >=1 = hidden
  let celebrateT = 0;
  let watch = null; // { box:'neg'|'pos', firstServe } armed after strike, judged on 1st bounce

  const flash = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeFlashTexture(), transparent: true, opacity: 0, depthTest: false }));
  flash.scale.set(0.3, 0.3, 1);
  s.add(flash);

  const ui = document.getElementById('serveUI');
  const mark = document.getElementById('serveMark');
  const label = document.getElementById('serveLabel');
  function showUI(v, text) {
    if (ui) ui.style.display = v ? 'block' : 'none';
    if (v && text && label) label.textContent = text;
  }

  function handWorld(out) { return J.fistL.getWorldPosition(out); }
  function sideName() { return SERVE.side === 'deuce' ? 'Einstand-Seite (rechts)' : 'Vorteil-Seite (links)'; }

  // Serve box clamp: backfield wall + side half (diagonal serve). Slide-along:
  // only the violated axis is clamped, everything else is never blocked.
  function clampServeBox() {
    const pp = pl.group.position;
    pp.z = Math.max(pp.z, SERVE_WALL_Z);
    if (SERVE.side === 'deuce') pp.x = Math.max(pp.x, SERVE_SIDE_MIN);
    else pp.x = Math.min(pp.x, -SERVE_SIDE_MIN);
  }

  // Wall feedback (shared by ready + toss windup): pushing into a wall shakes + hints.
  // Visual only: group/slide movement is never blocked.
  function wallFeedback(dt) {
    if (wallShake > 0) {
      wallShake = Math.max(0, wallShake - dt);
      J.root.position.x += Math.sin(wallShake * 200) * 0.02 * (wallShake / 0.2); // decaying shake
    } else {
      const pp = pl.group.position;
      let msg = null;
      if (input.z < -0.1 && pp.z <= SERVE_WALL_Z + 0.02) msg = 'Hinter der Grundlinie bleiben!';
      else if (SERVE.side === 'deuce' && input.x < -0.1 && pp.x <= SERVE_SIDE_MIN + 0.02) {
        msg = 'Einstand: rechte Hälfte! (Aufschlag ist diagonal)';
      } else if (SERVE.side === 'ad' && input.x > 0.1 && pp.x >= -SERVE_SIDE_MIN - 0.02) {
        msg = 'Vorteil: linke Hälfte! (Aufschlag ist diagonal)';
      }
      if (msg) { wallShake = 0.2; setStatus(msg + ' – SPACE = hochwerfen'); }
    }
  }

  // ---- pop-free blending: capture current pose, ease into serve poses ----
  function capturePose() { return pl.captureRig(); }
  function startBlend() { blendFrom = capturePose(); blendT = 0; }
  function applyBlend(dt, dur) {
    if (!blendFrom) return;
    blendT = Math.min(1, blendT + dt / (dur || 0.18));
    pl.blendRig(blendFrom, easeOutCubic(blendT));
    if (blendT >= 1) blendFrom = null;
  }

  function enterReady(msg) {
    SERVE.side = (SERVE.points % 2 === 0) ? 'deuce' : 'ad';
    SERVE.firstServe = true;
    SERVE.faults = 0;
    const sx = SERVE.side === 'deuce' ? 2.6 : -2.6;
    pl.group.position.set(sx, 0, 13.3);
    // AI to diagonal return stance (receiver stands where the serve lands)
    bl.hitter = null;
    watch = null;
    freezeT = 0;
    celebrateT = 0;
    handWorld(tmpV);
    bl.reset(tmpV);
    mode = 'ready';
    tPhase = 0;
    rockT = 0; wallShake = 0; // restart rocking rhythm + wall feedback
    startBlend(); // ease from rally pose into serve crouch (no pop)
    input.swingPressed = false; // clear stale presses
    showUI(false);
    if (typeof onEnterReady === 'function') onEnterReady();
    setStatus(msg || `Aufschlag (${sideName()}) – laufen ok, SPACE = hochwerfen`);
  }

  // External hook set by setup: positions AI + resets rally counter display
  let onEnterReady = null;

  function startToss() {
    handWorld(tossPos);
    handY = tossPos.y;
    released = false; // ball lifts with the hand during windup, then releases
    tossVel = SERVE_TOSS_V0;
    apexY = handY + (SERVE_TOSS_V0 * SERVE_TOSS_V0) / (2 * -BALL.gravity); // ~2.0m
    apexT = SERVE_TOSS_V0 / -BALL.gravity; // ~0.39s
    mode = 'toss';
    tPhase = 0;
    showUI(true, SERVE.firstServe ? 'SPACE im GRÜNEN Bereich schlagen!' : '2. Aufschlag – ruhiger, sicher treffen!');
  }

  function serveTarget(q) {
    // Diagonal box: deuce -> x<0 on AI side, ad -> x>0
    const sign = SERVE.side === 'deuce' ? -1 : 1;
    let tx, tz, flight;
    if (!SERVE.firstServe) {
      // 2nd serve: safe middle of box, high arc, forgiving
      const qq = Math.max(q, 0.5);
      tx = sign * (1.2 + Math.random() * 1.6);
      tz = -(2.4 + Math.random() * 2.6);
      flight = 1.0;
    } else if (q >= 0.7) {
      tx = sign * (2.6 + Math.random() * 1.1); // corner attack
      tz = -(4.2 + Math.random() * 1.6);
      flight = q > 0.9 ? 0.75 : 0.8;
    } else if (q >= 0.35) {
      tx = sign * (1.2 + Math.random() * 1.8); // safe
      tz = -(2.5 + Math.random() * 2.5);
      flight = 0.9;
    } else {
      // Shanked timing -> long or wide (fault)
      if (Math.random() < 0.5) { tx = sign * (1.5 + Math.random() * 2); tz = -(SERVE_BOX.zServe + 0.4 + Math.random() * 1.6); }
      else { tx = sign * (SERVE_BOX.xMax + 0.4 + Math.random() * 1.2); tz = -(2 + Math.random() * 3); }
      flight = 0.85;
    }
    return { target: new THREE.Vector3(tx, BALL.radius, tz), flight };
  }

  function doStrike(q) {
    // Foot fault at strike moment (baseline outer edge z=11.885) + wrong half (diagonal!).
    // Unreachable through the walls – safety net only.
    if (pl.group.position.z < COURT_DIMENSIONS.halfLength) {
      return doFault('Fußfehler! (über die Grundlinie getreten)');
    }
    const pp = pl.group.position;
    if ((SERVE.side === 'deuce') !== (pp.x >= 0)) {
      return doFault('Falsche Aufschlagseite! (Aufschlag muss diagonal)');
    }
    // Contact = ball position at strike (exact sync by construction, zero snap).
    // Near the apex the ball is ~2.0m, racket head reaches ~1.9m overhead (gap <= 0.15m).
    contact.copy(bl.mesh.position);
    const { target, flight } = serveTarget(q);
    bl.hitter = 'player';
    bl.hit(contact.clone(), target, flight);
    /* TODO (sound): play serve-hit pop here */
    watch = { sign: SERVE.side === 'deuce' ? -1 : 1, firstServe: SERVE.firstServe, judged: false };
    freezeT = SERVE_TIMING.freeze; // 80ms impact frame
    flashT = 0;
    flash.position.copy(contact);
    mode = 'strike';
    tPhase = 0;
    showUI(false);
  }

  function doFault(reason) {
    bl.netTouched = false;
    if (SERVE.firstServe) {
      SERVE.firstServe = false;
      SERVE.faults = 1;
      enterReadyKeepSide(`${reason} – 2. Aufschlag`);
    } else {
      awardPoint('ai', `Doppelfehler – ${reason}`);
    }
  }

  function enterReadyKeepSide(msg) {
    // 2nd serve / let: same side, server stays roughly where they are (clamped to box)
    watch = null;
    const pp = pl.group.position;
    pp.z = Math.max(pp.z, COURT_DIMENSIONS.halfLength + 0.6);
    if (SERVE.side === 'deuce') pp.x = Math.max(pp.x, SERVE_SIDE_MIN);
    else pp.x = Math.min(pp.x, -SERVE_SIDE_MIN);
    handWorld(tmpV);
    bl.reset(tmpV);
    mode = 'ready';
    tPhase = 0;
    rockT = 0; wallShake = 0;
    startBlend();
    input.swingPressed = false;
    showUI(false);
    if (typeof onEnterReady === 'function') onEnterReady();
    setStatus(msg + ' – SPACE = hochwerfen');
  }

  function inBox(b) {
    // Correct service box on AI side incl. small margin
    const inX = watch.sign < 0
      ? (b.x > -(SERVE_BOX.xMax + 0.12) && b.x < -0.02)
      : (b.x > 0.02 && b.x < (SERVE_BOX.xMax + 0.12));
    const inZ = b.z < -0.02 && b.z > -(SERVE_BOX.zServe + 0.12);
    return inX && inZ;
  }

  // Called from main loop for every bounce; returns true if serve judged it
  function consumeBounce(b) {
    if (!watch || watch.judged) return false;
    watch.judged = true;
    const wasNet = bl.netTouched;
    bl.netTouched = false;
    if (wasNet && inBox(b)) {
      // Let: net touch + in -> replay same serve, no fault added
      const wasFirst = watch.firstServe; // save before enterReadyKeepSide clears watch
      enterReadyKeepSide('Let – Netz, aber drin! Wiederholung');
      SERVE.firstServe = wasFirst;
      return true;
    }
    if (inBox(b)) {
      // Good serve -> rally resumes
      watch = null;
      celebrateT = 0.5; // happy hops
      if (typeof onGoodServe === 'function') onGoodServe();
      return true; // rally continues, not a reset
    }
    doFault(`Aufschlag im Aus (${b.x.toFixed(1)}, ${b.z.toFixed(1)})`);
    return true;
  }

  let onGoodServe = null;

  // ---- keyframed poses (driven by the mascot tennis clips; racket stays outboard) ----
  function poseReady(rock) {
    pl.applyTennisPose('serveReady', 0, { rock: rock ?? 0 });
  }

  function poseToss(kUp, kTrophy) {
    pl.applyTennisPose('serveToss', 0, { kUp, kTrophy });
  }

  function poseStrike(k) {
    const freeze = freezeT > 0 ? freezeT / SERVE_TIMING.freeze : 0;
    pl.applyTennisPose('serveStrike', k, { freeze });
  }

  function poseFollow(k, happy) {
    pl.applyTennisPose('serveFollow', k, { happy });
  }

  function update(dt) {
    // Impact freeze + flash always tick (real time)
    if (freezeT > 0) freezeT = Math.max(0, freezeT - dt);
    if (flashT < 1) {
      flashT = Math.min(1, flashT + dt / 0.16);
      flash.material.opacity = 1 - flashT;
      const sc = 0.3 + flashT * 0.9;
      flash.scale.set(sc, sc, 1);
    } else if (flash.material.opacity !== 0) {
      flash.material.opacity = 0;
    }

    // Celebration hops + release blend after a good serve (runs even in rally mode)
    if (mode === 'off') {
      if (celebrateT > 0) {
        celebrateT = Math.max(0, celebrateT - dt);
        J.root.position.y += Math.abs(Math.sin(celebrateT * 14)) * 0.09 * (celebrateT / 0.5);
        J.head.rotation.z += Math.sin(celebrateT * 16) * 0.03;
      }
      if (releaseT > 0) {
        releaseT = Math.max(0, releaseT - dt);
        applyBlend(dt, 0.3); // ease follow-through end into live rally pose (no pop)
      }
      return;
    }

    const slowmo = SERVE.firstServe ? 1 : SERVE_TIMING.slowmo2nd;

    if (mode === 'ready') {
      // Free positioning in the whole backfield; a hard wall keeps the court off-limits
      // (slide-along: only z is clamped, x movement is never blocked).
      pl.update(dt, { x: input.x, z: input.z, skipPose: true });
      clampServeBox();
      // Rocking motion (real pre-serve rhythm): weight shifts front-back twice, then settles
      rockT += dt;
      const rock = rockT < 1.2 ? Math.sin((rockT / 1.2) * Math.PI * 4) * 0.06 * (1 - rockT / 1.2) : 0;
      poseReady(rock);
      wallFeedback(dt); // shake + hint when pushing into the wall
      applyBlend(dt, 0.18); // ease rally pose -> serve crouch
      handWorld(tmpV);
      bl.mesh.position.copy(tmpV);
      bl.velocity.set(0, 0, 0);
      if (input.swingPressed) { input.swingPressed = false; startToss(); }
      return;
    }

    // strike / follow: feet planted + wall holds (kills residual drift from the run-up).
    // (Toss windup moves via its own branch below.)
    if (mode !== 'toss') {
      pl.update(dt, { x: 0, z: 0, skipPose: true });
      clampServeBox(); // no drift under the wall or across the center line
      J.root.position.z *= Math.max(0, 1 - dt * 6); // decay any ready-rock leftover smoothly
    }

    if (mode === 'toss') {
      tPhase += dt;
      const windup = SERVE_TIMING.windup;
      if (!released) {
        // Windup: free backfield movement (same walls), arm rises with ball in hand
        pl.update(dt, { x: input.x, z: input.z, skipPose: true });
        clampServeBox();
        wallFeedback(dt);
        const kUp = 0.45 * easeOutCubic(tPhase / windup);
        handWorld(tmpV);
        bl.mesh.position.copy(tmpV);
        bl.velocity.set(0, 0, 0);
        poseToss(kUp, 0);
        if (mark) mark.style.left = '0%';
        if (tPhase >= windup) {
          released = true;
          pl.velocity.set(0, 0, 0); // kill run-up momentum: no drift under the wall
          handWorld(tossPos);
          handY = tossPos.y;
          tossVel = SERVE_TOSS_V0;
          apexY = handY + (SERVE_TOSS_V0 * SERVE_TOSS_V0) / (2 * -BALL.gravity);
          apexT = SERVE_TOSS_V0 / -BALL.gravity;
        }
        return;
      }
      const tf = tPhase - windup;
      pl.update(dt, { x: 0, z: 0, skipPose: true }); // feet planted from release on
      clampServeBox(); // no drift under the wall or across the center line
      // Manual toss ballistics (main loop skips ball.update while held)
      tossVel += BALL.gravity * dt;
      tossPos.y += tossVel * dt;
      bl.mesh.position.copy(tossPos);
      bl.velocity.set(0, 0, 0);
      poseToss(Math.min(1, 0.45 + 0.55 * easeOutCubic(tf / apexT)), easeInOutCubic((tf - (apexT - 0.15)) / 0.15));
      // Timing-bar marker: 0 (hand) -> 1 (apex)
      if (mark) {
        const m = THREE.MathUtils.clamp((tossPos.y - handY) / Math.max(0.001, apexY - handY), 0, 1.05);
        mark.style.left = (m * 100).toFixed(1) + '%';
      }
      if (input.swingPressed) {
        input.swingPressed = false;
        const err = Math.abs(tf - apexT);
        const q = THREE.MathUtils.clamp(1 - err / 0.28, 0, 1);
        doStrike(q);
        return;
      }
      if (tf >= apexT + 0.06) { doStrike(0.8); return; } // auto-strike near apex
      if (tossPos.y < handY + 0.25 && tossVel < 0) {
        // Dropped the toss -> re-toss, no fault (real tennis rule)
        setStatus('Wurf daneben – nochmal hochwerfen (kein Fehler)');
        startToss();
      }
      return;
    }

    if (mode === 'strike') {
      const dur = SERVE_TIMING.strike / slowmo;
      if (freezeT <= 0) tPhase += dt; // impact freeze holds the contact pose
      poseStrike(tPhase / dur);
      if (tPhase >= dur) { mode = 'follow'; tPhase = 0; }
      return;
    }

    if (mode === 'follow') {
      tPhase += dt;
      const dur = SERVE_TIMING.follow / slowmo;
      poseFollow(tPhase / dur, celebrateT > 0 || !!watch);
      if (tPhase >= dur) {
        mode = 'off'; // rally resumes, watch judges 1st bounce
        showUI(false);
        input.swingPressed = false; // discard presses during strike/follow (ball unreachable)
        startBlend(); // ease follow-through end into live rally pose (no pop)
        releaseT = 0.3;
      }
      return;
    }
  }

  return {
    update, enterReady, consumeBounce,
    // Disarm the serve watch when the ball is hit again before its 1st bounce
    // (volley): the serve is over, live rally takes over. Called on every rally hit.
    onRallyHit() { if (watch && !watch.judged) watch = null; },
    setHooks(hooks) { onEnterReady = hooks.onEnterReady || null; onGoodServe = hooks.onGoodServe || null; },
    isActive() { return mode !== 'off'; },
    holdsBall() { return mode === 'ready' || mode === 'toss'; },
    frozen() { return freezeT > 0; },
    getMode() { return mode; }
  };
}

createTennisCourt(scene);
try {
  mascotGltf = await new GLTFLoader().loadAsync(MASCOT_URL);
} catch (err) {
  const el = document.getElementById('loading');
  if (el) el.textContent = 'Rig konnte nicht geladen werden: ' + (err && err.message ? err.message : err);
  throw err;
}
const loadingEl = document.getElementById('loading');
if (loadingEl) loadingEl.remove();
const player = createPlayer(scene);
const opponent = createPlayer(scene, {
  name: 'opponent', faceDir: 1, shirtColor: 0x2a9dca, speed: AI.speed,
  spawn: new THREE.Vector3(0, 0, -13.8),
  bounds: { minX: -9, maxX: 9, minZ: -17, maxZ: -0.5 }
});
if (PROBE) window.__museTennis = { player, opponent };
const ball = createBall(scene);
const ai = createOpponentAI(opponent, ball);
const serve = createServeController(player, ball, scene);

// ---------- Rally: hitting, aim, reset ----------
// Every point starts with a serve (side toggles via SERVE.points).
// TODO (game): real score 15/30/40, AI serves, sound
let rallyHits = 0;
let deadTimer = 0;
let prevHitter = null; // split-step trigger: hop the receiver on hitter change
const statusEl = document.getElementById('status');
function setStatus(msg) { if (statusEl) statusEl.textContent = msg; }
function refreshStatus(extra = '') {
  setStatus(`Ballwechsel: ${rallyHits}` + (extra ? ` • ${extra}` : ''));
}

// ============================================================
// SCORE - points (15/30/40/Deuce/Vorteil), games, sets (advantage set, no tiebreak)
// TODO (game): tiebreak at 6:6, AI serves alternate games, match end screen, sound
// ============================================================
const SCORE = { p: 0, a: 0, pG: 0, aG: 0, pS: 0, aS: 0 };
const POINT_NAMES = ['0', '15', '30', '40'];
function pointText() {
  const { p, a } = SCORE;
  if (p >= 3 && a >= 3) {
    if (p === a) return 'Einstand';
    return p > a ? 'Vorteil Du' : 'Vorteil KI';
  }
  return `${POINT_NAMES[Math.min(p, 3)]}:${POINT_NAMES[Math.min(a, 3)]}`;
}
function updateScoreboard() {
  const el = document.getElementById('score');
  if (el) el.textContent = `🎾 Sätze ${SCORE.pS}:${SCORE.aS} • Spiele ${SCORE.pG}:${SCORE.aG} • Punkte ${pointText()}`;
}
function awardPoint(winner, reason) {
  if (winner === 'player') SCORE.p++; else SCORE.a++;
  let msg = (reason ? reason + ' – ' : '') + `Punkt ${(winner === 'player' ? 'für dich' : 'für die KI')} (${pointText()})`;
  // Game won? (4+ points and 2 ahead)
  const d = SCORE.p - SCORE.a;
  if ((SCORE.p >= 4 || SCORE.a >= 4) && Math.abs(d) >= 2) {
    const gw = d > 0 ? 'player' : 'ai';
    if (gw === 'player') SCORE.pG++; else SCORE.aG++;
    SCORE.p = 0; SCORE.a = 0;
    msg = `SPIEL ${(gw === 'player' ? 'für dich' : 'für die KI')}! (Spiele ${SCORE.pG}:${SCORE.aG})`;
    // Set won? First to 6, 2 games ahead (advantage set)
    const gd = SCORE.pG - SCORE.aG;
    if ((SCORE.pG >= 6 || SCORE.aG >= 6) && Math.abs(gd) >= 2) {
      if (gd > 0) SCORE.pS++; else SCORE.aS++;
      msg = `SATZ ${(gd > 0 ? 'für dich' : 'für die KI')}! (Sätze ${SCORE.pS}:${SCORE.aS}) – neuer Satz`;
      SCORE.pG = 0; SCORE.aG = 0;
    }
  }
  updateScoreboard();
  rallyHits = 0; deadTimer = 0;
  SERVE.points++; // serve side alternates every point played
  serve.enterReady(msg + ' – neuer Aufschlag, SPACE = hochwerfen');
}

serve.setHooks({
  onEnterReady() {
    rallyHits = 0;
    // AI to diagonal return stance (mirrors serve side)
    const ax = SERVE.side === 'deuce' ? -1.6 : 1.6;
    opponent.group.position.set(ax, 0, -12.4);
  },
  onGoodServe() {
    rallyHits = 1;
    refreshStatus('Guter Aufschlag!');
  }
});

// Player aim: direction keys shape the shot, default deep cross-court
function playerAimTarget() {
  const p = player.group.position;
  const x = THREE.MathUtils.clamp(p.x * 0.35 + input.x * 5.0 + (Math.random() - 0.5) * 1.4, -5.2, 5.2);
  const z = THREE.MathUtils.clamp(-8.5 - input.z * 1.5 + (Math.random() - 0.5) * 1.0, -11.6, -6.0);
  return new THREE.Vector3(x, BALL.radius, z);
}

function tryPlayerHit() {
  const bp = ball.mesh.position;
  const pp = player.group.position;
  const d = Math.hypot(bp.x - pp.x, bp.z - pp.z);
  if (bp.z > -0.6 && bp.y < 2.6 && d < 2.4) {
    ball.hitter = 'player';
    ball.hit(bp.clone(), playerAimTarget(), 0.95);
    serve.onRallyHit(); // serve watch off: live rally now
    rallyHits++;
    refreshStatus();
    return true;
  }
  return false; // whiff: swing animation plays anyway
}

function resetRally(msg, winner) {
  // Rally point over: awarded points run the score (side toggles),
  // neutral endings (no hitter, e.g. lost ball) just re-serve without a point.
  if (winner) { awardPoint(winner, msg); return; }
  rallyHits = 0;
  deadTimer = 0;
  serve.enterReady((msg ? msg + ' – ' : '') + 'neuer Aufschlag, SPACE = hochwerfen');
}

function safetyReset() {
  // Neutral reset (dead ball / R key): no point counted
  rallyHits = 0;
  deadTimer = 0;
  serve.enterReady();
}

window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'r') safetyReset();
});

serve.enterReady('1. Aufschlag – hinter die Grundlinie, SPACE = hochwerfen');
updateScoreboard();

// Follow-Cam (toggle with C / Button), Orbit bleibt aktiv
let followCam = true;
const camBtn = document.getElementById('camBtn');
function setFollow(v) {
  followCam = v;
  if (camBtn) camBtn.textContent = followCam ? '📷 Follow-Cam: AN' : '📷 Follow-Cam: AUS';
}
if (camBtn) camBtn.addEventListener('click', () => setFollow(!followCam));
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') setFollow(!followCam);
});
const followOffset = new THREE.Vector3(0, 6.8, 10.0);
const followLook = new THREE.Vector3(0, 1.0, -3.0); // preallocated (no per-frame alloc)
const desiredCam = new THREE.Vector3();
const desiredTarget = new THREE.Vector3();

// ---------- Resize + Loop ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); // 60fps-unabhängig, clamp bei Tab-Wechsel
  pollInput();
  // Both fighters track the ball side for forehand/backhand auto-select
  player.noteBall(ball.mesh.position.x - player.group.position.x);
  opponent.noteBall(ball.mesh.position.x - opponent.group.position.x);

  if (serve.isActive()) {
    serve.update(dt); // serve owns player animation + ball (ready/toss/strike/follow)
  } else {
    if (player.update(dt)) tryPlayerHit(); // Space -> swing started -> hit if in reach
    serve.update(dt); // celebration hops + release blend only
  }
  if (serve.holdsBall()) {
    // Serve held (ready/toss): AI holds its diagonal return stance, no chasing
    opponent.update(dt, { x: 0, z: 0 });
  } else if (ai.update(dt)) {
    rallyHits++; refreshStatus(); serve.onRallyHit(); // AI hit -> count rally, serve over
  }

  // Split-step: the receiver hops when the hitter strikes (real tennis timing cue)
  if (!ball.hitter) prevHitter = null;
  else if (ball.hitter !== prevHitter) {
    (ball.hitter === 'player' ? opponent : player).splitStep();
    prevHitter = ball.hitter;
  }

  // Ball physics skipped while serve holds it (ready/toss) or during impact freeze
  let bounce = null;
  if (!serve.holdsBall() && !serve.frozen()) bounce = ball.update(dt);

  if (bounce && !serve.consumeBounce(bounce)) {
    if (bounce.out) {
      // Out: the other side of the last hitter wins (strict line calls = TODO)
      const w = ball.hitter === 'player' ? 'ai' : ball.hitter === 'ai' ? 'player' : null;
      resetRally(`Aus bei (${bounce.x.toFixed(1)}, ${bounce.z.toFixed(1)})`, w);
    } else if (bounce.n >= 2) {
      // Double bounce: whoever failed to return loses (no hitter = neutral replay)
      const w = ball.hitter ? (bounce.side === 'ai' ? 'player' : 'ai') : null;
      resetRally('Doppelt aufgekommen!', w);
    }
  }

  // Dead ball (rolled out) or lost ball (safety) -> fresh serve, no point counted
  if (!serve.holdsBall()) {
    const bs = ball.velocity.length();
    if (bs < 0.8 && ball.mesh.position.y <= BALL.radius + 0.02) deadTimer += dt;
    else deadTimer = 0;
    const bp2 = ball.mesh.position;
    if (deadTimer > 1.2 || Math.abs(bp2.x) > 16 || Math.abs(bp2.z) > 22 || bp2.y > 30) {
      safetyReset();
    }
  } else {
    deadTimer = 0;
  }

  if (followCam) {
    desiredCam.copy(player.group.position).add(followOffset);
    camera.position.lerp(desiredCam, Math.min(1, dt * 3.5));
    desiredTarget.copy(player.group.position).add(followLook);
    controls.target.lerp(desiredTarget, Math.min(1, dt * 4.0));
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
